<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roga Etiquetas — Avance ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    /* ROGA — paleta oficial */
    --brand-red:#B20E10;
    --gray-mid:#969696;
    --gray-light:#CCCCCC;
    --paper:#F4F4F4;
    --surface:#FFFFFF;
    --line:var(--gray-light);
    --ink:#262626;
    --ink-soft:var(--gray-mid);
    --accent:var(--brand-red);
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 80px;}

  /* Header */
  header{display:flex;align-items:center;gap:18px;margin-bottom:22px;}
  .logo{
    flex:none;
    width:150px;
    height:88px;
    object-fit:contain;
    object-position:center;
    display:block;
  }
  .regmark{flex:none;width:40px;height:40px;margin-top:4px;}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;margin:0 0 4px;letter-spacing:-0.01em;}
  .sub{color:var(--ink-soft);font-size:14px;margin:0;}

  /* Control strip */
  .strip{display:flex;gap:6px;margin:20px 0 26px;flex-wrap:wrap;}
  .swatch{
    display:flex;align-items:center;gap:6px;
    background:var(--surface);border:1px solid var(--line);border-radius:100px;
    padding:5px 10px 5px 6px;cursor:pointer;transition:border-color .15s;
  }
  .swatch:hover{border-color:var(--brand-red);}
  .swatch.active{border-color:var(--brand-red);}
  .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .swatch span{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;letter-spacing:.02em;}

  /* Module card */
  .module{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;}
  .module-head{display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer;}
  .code{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:var(--ink-soft);background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:3px 6px;flex:none;}
  .module-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;flex:1;}
  .status-pill{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:4px 9px;border-radius:100px;color:#fff;flex:none;}
  .chev{flex:none;color:var(--ink-soft);transition:transform .18s;font-size:12px;}
  .module.open .chev{transform:rotate(90deg);}
  .module-body{display:none;padding:0 18px 18px;border-top:1px solid var(--line);}
  .module.open .module-body{display:block;}

  .status-select{font-family:'IBM Plex Mono',monospace;font-size:10px;border:1px solid var(--line);border-radius:100px;padding:4px 8px;background:var(--paper);color:var(--ink);cursor:pointer;}

  section.block{margin-top:16px;}
  .block-title{font-size:12px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
  ul.items{list-style:none;padding:0;margin:0;}
  ul.items li{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:14px;border-bottom:1px dashed var(--line);}
  ul.items li:last-child{border-bottom:none;}
  ul.items li.decision, ul.items li.note{align-items:flex-start;}
  .chk{margin-top:3px;flex:none;width:15px;height:15px;accent-color:var(--brand-red);cursor:pointer;}
  .item-text{flex:1;line-height:1.4;}
  .item-text.done{text-decoration:line-through;color:var(--ink-soft);}
  .item-date{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-soft);flex:none;padding-top:2px;}
  .del{flex:none;background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;}
  .del:hover{color:var(--brand-red);}

  .add-row{display:flex;gap:6px;margin-top:8px;}
  .add-row input{flex:1;font-family:'Inter',sans-serif;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--paper);color:var(--ink);}
  .add-row input:focus{outline:none;border-color:var(--ink-soft);}
   .add-row button{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;border:1px solid var(--brand-red);background:var(--brand-red);color:#fff;border-radius:6px;padding:0 12px;cursor:pointer;}
  .add-row button:hover{opacity:.85;}
  .empty-hint{font-size:13px;color:var(--ink-soft);font-style:italic;padding:4px 0;}

  /* Bitacora */
  .bitacora{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-top:26px;}
  .bitacora h2{font-family:'Space Grotesk',sans-serif;font-size:16px;margin:0 0 3px;}
  .bitacora .sub{margin-bottom:14px;}
  .bit-entry{border-bottom:1px dashed var(--line);padding:10px 0;font-size:14px;display:flex;gap:10px;}
  .bit-entry:last-child{border-bottom:none;}
  .bit-meta{flex:none;width:110px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-soft);padding-top:2px;}
  .bit-text{flex:1;line-height:1.4;}
  .bit-add{display:grid;grid-template-columns:120px 1fr auto;gap:6px;margin-top:12px;}
  .bit-add select, .bit-add input{font-family:'Inter',sans-serif;font-size:13px;border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:var(--paper);color:var(--ink);}

  .save-footer{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:30px;flex-wrap:wrap;}
  .save-status{font-size:12.5px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;}
  .save-status .led{width:8px;height:8px;border-radius:50%;background:var(--gray-light);flex:none;}
  .save-status.saving .led{background:#E0982A;}
  .save-status.saved .led{background:#1D8C55;}
  .save-status.error .led{background:var(--brand-red);}
  .save-btn{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;border:1px solid var(--brand-red);background:var(--brand-red);color:#fff;border-radius:100px;padding:9px 20px;cursor:pointer;letter-spacing:.02em;}
  .save-btn:hover{opacity:.88;}
  .save-btn:disabled{opacity:.5;cursor:default;}
  footer{text-align:center;color:var(--ink-soft);font-size:12px;margin-top:24px;}
  .loading{text-align:center;padding:60px 0;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:13px;}
</style>
</head>

      <select id="bitModule"></select>
      <input id="bitText" type="text" placeholder="¿Qué se acordó o avanzó?">
      <button onclick="addBitacora()" style="font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;border:1px solid var(--brand-red);background:var(--brand-red);color:#fff;border-radius:6px;padding:0 14px;cursor:pointer;">Agregar</button>
    </div>
  </div>

  <div class="save-footer">
    <div class="save-status" id="saveStatus"><span class="led"></span><span id="saveStatusText">Cargando…</span></div>
    <button class="save-btn" id="saveBtn" onclick="manualSync()">Guardar cambios</button>
  </div>

  <footer>Roga Etiquetas · Proyecto ERP — datos guardados en la base de datos del proyecto</footer>
</div>

<script>
/* ====== Conexión a Supabase (proyecto roga-erp-avance) ====== */
const SUPABASE_URL = 'https://strbzhushjjzskuohlsq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN0cmJ6aHVzaGpqenNrdW9obHNxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNTY1MDAsImV4cCI6MjEwMjYzMjUwMH0.wFyPSd1zgffmqLec463oG1UIePeylb9QTJAJfss3Wqo';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STATUS = {
  'no-iniciado': {label:'No iniciado', color:'var(--gray-light)', textColor:'#262626'},
  'en-definicion': {label:'En definición', color:'var(--gray-mid)', textColor:'#fff'},
  'definido': {label:'Definido', color:'#7A0A0C', textColor:'#fff'},
  'en-desarrollo': {label:'En desarrollo', color:'var(--brand-red)', textColor:'#fff'},
};

let state = null;

function setSaveStatus(kind, text){
  const el = document.getElementById('saveStatus');
  el.className = 'save-status ' + kind;
  document.getElementById('saveStatusText').textContent = text;
}

/* ====== Carga de datos desde la base ====== */
async function loadState(){
  setSaveStatus('saving', 'Cargando…');
  try{
    const [modulesRes, questionsRes, decisionsRes, pendingRes, notesRes, bitacoraRes] = await Promise.all([
      db.from('modules').select('*').order('position'),
      db.from('questions').select('*').order('position'),
      db.from('decisions').select('*').order('created_at'),
      db.from('pending_tasks').select('*').order('position'),
      db.from('notes').select('*').order('created_at'),
      db.from('bitacora').select('*').order('created_at', {ascending:false}),
    ]);
    for(const r of [modulesRes, questionsRes, decisionsRes, pendingRes, notesRes, bitacoraRes]){
      if(r.error) throw r.error;
    }
    const openIds = new Set((state ? state.modules.filter(m=>m.open).map(m=>m.id) : ['ventas']));
    state = {
      modules: modulesRes.data.map(m => ({
        id:m.id, code:m.code, name:m.name, status:m.status, open: openIds.has(m.id),
        questions: questionsRes.data.filter(q=>q.module_id===m.id),
        decisions: decisionsRes.data.filter(d=>d.module_id===m.id),
        pending:   pendingRes.data.filter(p=>p.module_id===m.id),
        notes:     notesRes.data.filter(n=>n.module_id===m.id),
      })),
      bitacora: bitacoraRes.data
    };
    render();
    setSaveStatus('saved', 'Guardado — sincronizado con la base de datos');
  }catch(err){
    console.error(err);
    setSaveStatus('error', 'Sin conexión con la base de datos. Intenta "Guardar cambios".');
  }
}

function manualSync(){ loadState(); }

function findModule(id){ return state.modules.find(m=>m.id===id); }

async function withSaving(mutation){
  setSaveStatus('saving', 'Guardando…');
  document.getElementById('saveBtn').disabled = true;
  try{
    await mutation();
    await loadState();
  }catch(err){
    console.error(err);
    setSaveStatus('error', 'No se pudo guardar. Revisa tu conexión e intenta de nuevo.');
  }finally{
    document.getElementById('saveBtn').disabled = false;
  }
}

function toggleModuleOpen(id){
  const m = findModule(id);
  m.open = !m.open;
  render();
}

function changeStatus(id, status){
  withSaving(async () => {
    const {error} = await db.from('modules').update({status}).eq('id', id);
    if(error) throw error;
  });
}

const TABLE_BY_LIST = {questions:'questions', decisions:'decisions', pending:'pending_tasks', notes:'notes'};

function addItem(moduleId, listName, inputId){
  const input = document.getElementById(inputId);
  const val = input.value.trim();
  if(!val) return;
  withSaving(async () => {
    const table = TABLE_BY_LIST[listName];
    const row = {module_id: moduleId, text: val};
    if(listName === 'decisions') row.decided_on = todayLabel();
    const {error} = await db.from(table).insert(row);
    if(error) throw error;
  });
}

function toggleDone(moduleId, listName, id, currentDone){
  withSaving(async () => {
    const table = TABLE_BY_LIST[listName];
    const {error} = await db.from(table).update({done: !currentDone}).eq('id', id);
    if(error) throw error;
  });
}

function deleteItem(moduleId, listName, id){
  withSaving(async () => {
    const table = TABLE_BY_LIST[listName];
    const {error} = await db.from(table).delete().eq('id', id);
    if(error) throw error;
  });
}

function todayLabel(){
  const d = new Date();
  return d.toLocaleDateString('es-MX', {day:'2-digit', month:'short'});
}

function addBitacora(){
  const modSel = document.getElementById('bitModule');
  const textInput = document.getElementById('bitText');
  const val = textInput.value.trim();
  if(!val) return;
  withSaving(async () => {
    const moduleId = modSel.value === 'general' ? null : modSel.value;
    const {error} = await db.from('bitacora').insert({module_id: moduleId, text: val, entry_date: todayLabel()});
    if(error) throw error;
  });
}

function deleteBitacora(id){
  withSaving(async () => {
    const {error} = await db.from('bitacora').delete().eq('id', id);
    if(error) throw error;
  });
}

function moduleName(id){
  if(!id) return 'General';
  const m = state.modules.find(x=>x.id===id);
  return m ? m.name : 'General';
}

function render(){
  renderStrip();
  renderModules();
  renderBitacora();
}

function renderStrip(){
  const strip = document.getElementById('strip');
  strip.innerHTML = state.modules.map(m=>{
    const st = STATUS[m.status];
    return `<div class="swatch ${m.open?'active':''}" onclick="scrollToModule('${m.id}')">
      <span class="dot" style="background:${st.color}"></span>
      <span>${m.code}</span>
    </div>`;
  }).join('');
}

function scrollToModule(id){
  const m = findModule(id);
  if(!m.open){ m.open = true; render(); }
  setTimeout(()=>{
    document.getElementById('mod-'+id).scrollIntoView({behavior:'smooth', block:'start'});
  }, 30);
}

function renderModules(){
  const container = document.getElementById('modules');
  container.innerHTML = state.modules.map(m=>{
    const st = STATUS[m.status];
    const statusOptions = Object.entries(STATUS).map(([k,v])=>
      `<option value="${k}" ${k===m.status?'selected':''}>${v.label}</option>`
    ).join('');

    return `
    <div class="module ${m.open?'open':''}" id="mod-${m.id}">
      <div class="module-head" onclick="toggleModuleOpen('${m.id}')">
        <span class="code">${m.code}</span>
        <span class="module-title">${m.name}</span>
        <span class="status-pill" style="background:${st.color};color:${st.textColor}">${st.label}</span>
        <span class="chev">▶</span>
      </div>
      <div class="module-body">
        <div style="margin-top:14px;">
          <label style="font-size:11px;color:var(--ink-soft);margin-right:6px;">Estatus:</label>
          <select class="status-select" onclick="event.stopPropagation()" onchange="changeStatus('${m.id}', this.value)">
            ${statusOptions}
          </select>
        </div>

        <section class="block">
          <div class="block-title">Preguntas por resolver</div>
          <ul class="items">
            ${m.questions.length ? m.questions.map(q=>`
              <li>
                <input type="checkbox" class="chk" ${q.done?'checked':''} onchange="toggleDone('${m.id}','questions','${q.id}',${q.done})">
                <span class="item-text ${q.done?'done':''}">${escapeHtml(q.text)}</span>
                <button class="del" onclick="deleteItem('${m.id}','questions','${q.id}')">×</button>
              </li>`).join('') : '<div class="empty-hint">Sin preguntas todavía.</div>'}
          </ul>
          <div class="add-row">
            <input id="in-q-${m.id}" type="text" placeholder="Agregar pregunta a resolver en junta..." onkeydown="if(event.key==='Enter')addItem('${m.id}','questions','in-q-${m.id}')">
            <button onclick="addItem('${m.id}','questions','in-q-${m.id}')">Agregar</button>
          </div>
        </section>

        <section class="block">
          <div class="block-title">Decisiones tomadas</div>
          <ul class="items">
            ${m.decisions.length ? m.decisions.map(d=>`
              <li class="decision">
                <span class="item-date">${d.decided_on}</span>
                <span class="item-text">${escapeHtml(d.text)}</span>
                <button class="del" onclick="deleteItem('${m.id}','decisions','${d.id}')">×</button>
              </li>`).join('') : '<div class="empty-hint">Sin decisiones registradas.</div>'}
          </ul>
          <div class="add-row">
            <input id="in-d-${m.id}" type="text" placeholder="Registrar decisión acordada..." onkeydown="if(event.key==='Enter')addItem('${m.id}','decisions','in-d-${m.id}')">
            <button onclick="addItem('${m.id}','decisions','in-d-${m.id}')">Agregar</button>
          </div>
        </section>

        <section class="block">
          <div class="block-title">Pendientes</div>
          <ul class="items">
            ${m.pending.length ? m.pending.map(p=>`
              <li>
                <input type="checkbox" class="chk" ${p.done?'checked':''} onchange="toggleDone('${m.id}','pending','${p.id}',${p.done})">
                <span class="item-text ${p.done?'done':''}">${escapeHtml(p.text)}</span>
                <button class="del" onclick="deleteItem('${m.id}','pending','${p.id}')">×</button>
              </li>`).join('') : '<div class="empty-hint">Sin pendientes.</div>'}
          </ul>
          <div class="add-row">
            <input id="in-p-${m.id}" type="text" placeholder="Agregar tarea pendiente..." onkeydown="if(event.key==='Enter')addItem('${m.id}','pending','in-p-${m.id}')">
            <button onclick="addItem('${m.id}','pending','in-p-${m.id}')">Agregar</button>
          </div>
        </section>

        <section class="block">
          <div class="block-title">Notas y documentos relacionados</div>
          <ul class="items">
            ${m.notes.length ? m.notes.map(n=>`
              <li class="note">
                <span class="item-text">${escapeHtml(n.text)}</span>
                <button class="del" onclick="deleteItem('${m.id}','notes','${n.id}')">×</button>
              </li>`).join('') : '<div class="empty-hint">Sin notas. Anota aquí el nombre del archivo/documento y dónde se guardó.</div>'}
          </ul>
          <div class="add-row">
            <input id="in-n-${m.id}" type="text" placeholder="Ej: Lista de precios 2026.xlsx — carpeta Drive/Ventas" onkeydown="if(event.key==='Enter')addItem('${m.id}','notes','in-n-${m.id}')">
            <button onclick="addItem('${m.id}','notes','in-n-${m.id}')">Agregar</button>
          </div>
        </section>
      </div>
    </div>`;
  }).join('');
}

function renderBitacora(){
  const list = document.getElementById('bitList');
  list.innerHTML = state.bitacora.length ? state.bitacora.map(b=>`
    <div class="bit-entry">
      <div class="bit-meta">${b.entry_date}<br>${escapeHtml(moduleName(b.module_id))}</div>
      <div class="bit-text">${escapeHtml(b.text)}</div>
      <button class="del" onclick="deleteBitacora('${b.id}')">×</button>
    </div>
  `).join('') : '<div class="empty-hint">Todavía no hay entradas de junta.</div>';

  const sel = document.getElementById('bitModule');
  sel.innerHTML = state.modules.map(m=>`<option value="${m.id}">${m.code} — ${m.name}</option>`).join('')
    + '<option value="general">General</option>';
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

loadState();
</script>
</body>
</html>
